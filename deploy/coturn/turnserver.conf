# coturn config for NANb voice calls.
#
# Relay-only by design: clients set iceTransportPolicy 'relay', so coturn only
# ever FORWARDS encrypted SRTP between the two peers — it holds no media keys
# and sees no plaintext (see docs/voice-calls-design.md). Peers never learn each
# other's IP; only this relay (which you run) does.

# ── Listeners ──────────────────────────────────────────────────────────────
listening-port=3478
tls-listening-port=443
# Behind 1:1 NAT (e.g. an AWS instance with an Elastic IP), advertise both:
#   external-ip=<PUBLIC_IP>/<PRIVATE_IP>
# external-ip=REPLACE_PUBLIC_IP/REPLACE_PRIVATE_IP

# ── Auth: TURN REST API (use-auth-secret) ──────────────────────────────────
# The secret MUST equal the app server's NANB_TURN_AUTH_SECRET. Credentials are
# minted, short-lived, by GET /turn/credentials — coturn validates the HMAC.
use-auth-secret
static-auth-secret=REPLACE_WITH_NANB_TURN_AUTH_SECRET
realm=turn.example.org

# ── TLS (Let's Encrypt) ────────────────────────────────────────────────────
# turns: on 443 punches through restrictive networks and is tunnellable over
# Tor (it's TCP control + relayed UDP media).
cert=/etc/letsencrypt/live/turn.example.org/fullchain.pem
pkey=/etc/letsencrypt/live/turn.example.org/privkey.pem

# ── Relayed media port range ───────────────────────────────────────────────
min-port=49152
max-port=65535

# ── Lock-down ──────────────────────────────────────────────────────────────
# Clients here only ever use UDP relay allocations. Refuse TCP *relayed peer*
# connections (RFC 6062): they would let any holder of a credential open TCP
# connections OUT of this box. (TURN-over-TCP/TLS *to* this server — the 3478/tcp
# and 443 turns: listeners above — is a different thing and is unaffected.)
no-tcp-relay
no-multicast-peers
# SSRF / lateral-movement guard: a relay must never be pointed at internal or
# special-purpose ranges. (coturn also denies loopback peers by default; the
# 127/8 + ::1 entries make that explicit and independent of the version.)
# IPv4
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=224.0.0.0-239.255.255.255
denied-peer-ip=240.0.0.0-255.255.255.255
# IPv6: loopback, unique-local fc00::/7, link-local fe80::/10, IPv4-mapped ::ffff:0:0/96
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=::ffff:0:0-::ffff:ffff:ffff
# Disable the legacy admin CLI / web UI entirely.
no-cli
# Drop privileges after binding.
proc-user=turnserver
proc-group=turnserver
# Anti-abuse quotas.
#  user-quota  = concurrent allocations per TURN *username*. The app server
#    now derives an opaque, per-account username that is stable for a credential
#    window (see internal/turn), so this really is a per-account cap: a 5-person
#    full-mesh group call needs ~15 allocations per participant's account and a
#    user may have 2-3 calls going, hence 48.
#  total-quota = concurrent allocations on the whole box.
user-quota=48
total-quota=1200
# Per-allocation bandwidth ceiling, bytes/second (~3 Mbit/s). Audio relays use
# ~10 KB/s and a 640x480 video call up to ~125 KB/s; this only bounds abuse
# (a relay used as a bulk pipe), so it must stay well above video.
max-bps=375000
# How long a nonce stays valid before the client must re-auth (seconds).
stale-nonce=600
# Quiet logs; bump to verbose only when debugging.
no-stdout-log
log-file=/var/log/turnserver/turn.log
simple-log

# ── Sanity checklist after editing (run on the TURN box) ───────────────────
#  [ ] syntax check: after the restart below, `journalctl -u coturn -n 50` and
#      turn.log must show no "Unknown argument" / "Bad configuration format"
#      (a bad option stops coturn from starting)
#  [ ] sudo systemctl restart coturn && systemctl is-active coturn   -> active
#  [ ] sudo ss -tulpn | grep turnserver  -> 3478 udp+tcp and 443 tcp still listen
#  [ ] a real call still gets a `relay` candidate (trickle-ice page / README §5)
#  [ ] static-auth-secret still equals the app server's NANB_TURN_AUTH_SECRET
#  [ ] `no-tcp-relay`: a call over turns:443 (TCP to the server) still works
#      — only RFC 6062 TCP *peer* allocations are refused
